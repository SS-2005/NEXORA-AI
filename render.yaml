databases:
  - name: nexora-db
    plan: free

services:
  - type: web
    name: nexora-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://nexora-frontend.onrender.com,http://localhost:3000

  - type: web
    name: nexora-frontend
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: BACKEND_API_URL
        fromService:
          type: web
          name: nexora-backend
          property: host
      - key: GEMINI_API_KEY
        sync: false
